name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    # ubuntu-latest fails: https://github.com/actions/runner/issues/2364
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        ansible-version: ['2.14', '2.15', '2.16', '2.17']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip modules
        uses: actions/cache@v5
        env:
          cache-name: cache-pip
        with:
          path: |
             ~/.cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}-python-${{ matrix.python-version }}

      - name: Cache ansible setup
        uses: actions/cache@v5
        env:
          cache-name: cache-ansible
        with:
          path: |
             ~/work/ansible-pfsense/ansible-pfsense/ansible
          key: build-${{ env.cache-name }}-ansible-${{ matrix.ansible-version }}

      # Runs a set of commands using the runners shell
      - name: Install ansible and deps
        run: |
          pip install ansible-core==${{ matrix.ansible-version }}.* dnspython parameterized pyyaml
          ansible-galaxy collection install community.internal_test_tools

      - name: Run ansible tests
        run: |
          pwd
          dir=$(pwd)
          mkdir -p ~/.ansible/collections/ansible_collections/pfsensible
          cd ~/.ansible/collections/ansible_collections/pfsensible
          cp -al $dir core
          cd core
          ansible-test sanity --requirements --python ${{ matrix.python-version }}
          ansible-test units --requirements --python ${{ matrix.python-version }} -v

  native-config:
    name: Native pfSense configuration tests
    runs-on: ubuntu-latest
    env:
      # Pin the upstream parser so serializer changes are reviewed explicitly.
      PFSENSE_XMLPARSE_REVISION: 480a1c0626c474eaa9ced5d668701a0d1d4408ac
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install native XML serializer
        env:
          PFSENSE_XMLPARSE_INC: ${{ runner.temp }}/xmlparse.inc
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-xml curl
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/pfsense/pfsense/${PFSENSE_XMLPARSE_REVISION}/src/etc/inc/xmlparse.inc" \
            --output "$PFSENSE_XMLPARSE_INC"
          php -r '
            require getenv("PFSENSE_XMLPARSE_INC");
            exit(function_exists("xml_parser_create") &&
                 function_exists("parse_xml_config") &&
                 function_exists("dump_xml_config") ? 0 : 1);
          '

      # Run directly: ansible-test filters the PFSENSE_* environment variables.
      - name: Run native configuration regression tests
        env:
          PFSENSE_XMLPARSE_INC: ${{ runner.temp }}/xmlparse.inc
        run: python -m unittest discover -s tests/unit/plugins/module_utils -p test_config_write.py -v
