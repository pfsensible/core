name: Release Ansible Collection

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core antsibull-changelog

      - name: Update version in galaxy.yml
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $VERSION/" galaxy.yml

      - name: Lint and generate changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          antsibull-changelog lint
          antsibull-changelog release --version "$VERSION"

      - name: Commit changelog and version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galaxy.yml CHANGELOG.rst changelogs/
          git commit -m "Release ${GITHUB_REF_NAME}"
          git push origin HEAD:${{ github.event.release.target_commitish }}
          git tag -f "${GITHUB_REF_NAME}"
          git push -f origin "${GITHUB_REF_NAME}"

      - name: Build collection artifact
        run: |
          ansible-galaxy collection build --output-path dist/

      - name: Upload tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Publish collection to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
        run: |
          ansible-galaxy collection publish dist/*.tar.gz --token "$ANSIBLE_GALAXY_TOKEN"
