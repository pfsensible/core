---
- name: Verify the alias and its referencing rule in live PF
  ansible.builtin.include_tasks: "{{ playbook_dir }}/verify.yml"
  when: system_case.verify_live | default(true)

- name: Observe an alias created before its referencing rule
  ansible.builtin.include_tasks: "{{ playbook_dir }}/observe.yml"
  when: not (system_case.verify_live | default(true))

- name: Verify the alias configuration and downloaded cache
  ansible.builtin.assert:
    that:
      - appliance.aliases | length == 1
      - appliance.aliases[0].type == 'urltable'
      - appliance.aliases[0].url == fixture_url
      - appliance.aliases[0].address == fixture_url
      - appliance.aliases[0].descr == 'CI URL table'
      - appliance.cache_entries == [expected_address]
